version: '3.9'
services:
  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"

  app1:
    build:
      context: ./App1
    depends_on:
      - redis
    ports:
      - "8081:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  app2:
    build:
      context: ./App2
    depends_on:
      - redis
    ports:
      - "8082:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - redis_exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
    ports:
      - "3000:3000"
